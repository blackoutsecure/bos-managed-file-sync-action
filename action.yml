name: 'Blackout Secure Managed File Sync'
description: >-
  Sync canonical repo files and managed blocks across repositories with drift detection and dry-run checks.
author: 'Blackout Secure'

branding:
  color: 'blue'
  icon: 'refresh-cw'

inputs:
  use_global_config:
    description: >-
      `auto` loads the org/hub-level global config when present. `true`
      requires it; `false` disables it.
    required: false
    default: 'auto'
  global_config_path:
    description: >-
      Org/hub-level config path. Auto-discovered by default and merged as the
      first tier; repo config (config_path) overrides it.
    required: false
    default: '.github/blackout-secure-managed-file-sync-global-config.json'
  config_path:
    description: >-
      Path to the repo config file. Defaults to auto-discovery of
      `.github/bos-universal-config.json` (preferred),
      `bos-universal-config.json`, `managed-file-sync.json`, or
      `.managed-file-sync.json`.
    required: false
    default: ''
  global_config_json:
    description: >-
      Inline JSON object to merge with the org/hub-level config before the
      repo config is applied. Useful for one-off workflow runs without creating
      a file.
    required: false
    default: ''
  config_json:
    description: >-
      Inline JSON object to merge with the repo/global config. Useful for
      ad hoc workflow runs without creating a config file.
    required: false
    default: ''
  services:
    description: >-
      Comma or space separated list of services to sync. Overrides the service
      list in the config. Use `*` to select every configured file service.
    required: false
    default: ''
  managed_files_path:
    description: >-
      Optional workflow override for the managed template directory used by
      `content_file` entries. When empty, the merged config value is used,
      falling back to `.github/managed-files`.
    required: false
    default: ''
  workload_arch:
    description: >-
      Runner workload selection for built-in variables: `auto`, `x64`,
      `arm64`, or `default`. `auto` uses `RUNNER_ARCH` when available.
    required: false
    default: 'auto'
  working_directory:
    description: 'Repository root to sync.'
    required: false
    default: '.'

  dry_run:
    description: '`true` to report what would change without writing any file.'
    required: false
    default: 'false'
  fail_on_drift:
    description: '`true` to exit non-zero when managed files are out of sync.'
    required: false
    default: 'false'
  show_diff:
    description: '`true` to print a unified diff for every changed file in the job log.'
    required: false
    default: 'true'

  python_version:
    description: 'Python version installed on the runner for the sync step.'
    required: false
    default: '3.12'

outputs:
  changed:
    description: '`true` when managed files changed (or would change in dry-run mode).'
    value: ${{ steps.sync.outputs.changed }}
  changed_count:
    description: 'Number of changed files.'
    value: ${{ steps.sync.outputs.changed_count }}
  changed_files:
    description: 'Newline separated list of changed file paths.'
    value: ${{ steps.sync.outputs.changed_files }}
  changed_files_json:
    description: 'JSON array of changed file paths.'
    value: ${{ steps.sync.outputs.changed_files_json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python_version }}

    - id: sync
      name: Sync managed files
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        MFS_USE_GLOBAL_CONFIG:   ${{ inputs.use_global_config }}
        MFS_GLOBAL_CONFIG_PATH:  ${{ inputs.global_config_path }}
        MFS_GLOBAL_CONFIG_JSON:  ${{ inputs.global_config_json }}
        MFS_CONFIG_PATH:         ${{ inputs.config_path }}
        MFS_CONFIG_JSON:         ${{ inputs.config_json }}
        MFS_SERVICES:            ${{ inputs.services }}
        MFS_MANAGED_FILES_PATH:  ${{ inputs.managed_files_path }}
        MFS_WORKLOAD_ARCH:       ${{ inputs.workload_arch }}
        MFS_DRY_RUN:             ${{ inputs.dry_run }}
        MFS_FAIL_ON_DRIFT:       ${{ inputs.fail_on_drift }}
        MFS_SHOW_DIFF:           ${{ inputs.show_diff }}
        GITHUB_TOKEN:            ${{ github.token }}
      run: |
        set -euo pipefail

        args=(--root . --global-config "${MFS_GLOBAL_CONFIG_PATH}")

        case "${MFS_USE_GLOBAL_CONFIG}" in
          auto|'') ;;
          true) args+=(--use-global-config) ;;
          false) args+=(--no-global-config) ;;
          *)
            echo "use_global_config must be 'auto', 'true', or 'false'" >&2
            exit 2
            ;;
        esac

        if [[ -n "${MFS_CONFIG_PATH}" ]]; then
          args+=(--config "${MFS_CONFIG_PATH}")
        fi

        if [[ -n "${MFS_GLOBAL_CONFIG_JSON}" ]]; then
          args+=(--global-config-json "${MFS_GLOBAL_CONFIG_JSON}")
        fi

        if [[ -n "${MFS_CONFIG_JSON}" ]]; then
          args+=(--config-json "${MFS_CONFIG_JSON}")
        fi

        if [[ -n "${MFS_SERVICES}" ]]; then
          args+=(--services "${MFS_SERVICES}")
        fi

        if [[ -n "${MFS_MANAGED_FILES_PATH}" ]]; then
          args+=(--managed-files-path "${MFS_MANAGED_FILES_PATH}")
        fi

        if [[ "${MFS_DRY_RUN}" == "true" ]]; then
          args+=(--dry-run)
        fi

        if [[ "${MFS_FAIL_ON_DRIFT}" == "true" ]]; then
          args+=(--fail-on-drift)
        fi

        if [[ "${MFS_SHOW_DIFF}" != "true" ]]; then
          args+=(--no-diff)
        fi

        python3 -I "${GITHUB_ACTION_PATH}/src/sync_kit/_bootstrap.py" apply "${args[@]}"
