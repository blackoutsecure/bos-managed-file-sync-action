# Dogfood: run the in-tree composite (`uses: ./`) against a scratch repo, so a
# PR that breaks the action breaks this workflow.
#
# A scratch directory is used instead of the repo root because this repo's own
# managed files are owned by bos-automation-hub (see `sync` in
# `bos-universal-config.json`) — syncing the root would fight the hub.
#
# Lives on `dev` only — never promoted (Marketplace publishing prohibits
# workflows on the default branch).
name: Self-sync · dogfood action against scratch repo

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-sync:
    name: Self-sync (scratch repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build scratch repo
        run: |
          set -euo pipefail
          mkdir -p scratch
          cat > scratch/bos-universal-config.json <<'JSON'
          {
            "managed_file_sync": {
              "services": ["common", "lf_line_endings", "dependabot_actions", "dotfiles", "codeowners"],
              "variables": {
                "owner": "Blackout Secure",
                "codeowner": "@blackoutsecure/security"
              }
            }
          }
          JSON

      - id: dry
        name: Sync (dry run)
        uses: ./
        with:
          working_directory: scratch
          dry_run: 'true'

      - name: Assert dry run reported drift and wrote nothing
        env:
          CHANGED: ${{ steps.dry.outputs.changed }}
          CHANGED_COUNT: ${{ steps.dry.outputs.changed_count }}
        run: |
          set -euo pipefail
          echo "changed=${CHANGED} changed_count=${CHANGED_COUNT}"
          [[ "${CHANGED}" == "true" ]]
          [[ ! -f scratch/.gitignore ]]

      - id: apply
        name: Sync (apply)
        uses: ./
        with:
          working_directory: scratch

      - name: Show outputs
        if: always()
        env:
          CHANGED_FILES: ${{ steps.apply.outputs.changed_files }}
        run: |
          set -euo pipefail
          echo "${CHANGED_FILES}"

      - name: Re-run must be clean
        uses: ./
        with:
          working_directory: scratch
          dry_run: 'true'
          fail_on_drift: 'true'
