# Blackout Secure universal sync kicker (hub-managed).
# Customize sync defaults in the `global_config_json` input below.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: Blackout Secure universal sync (kicker)
run-name: >-
  Blackout Secure universal sync / ${{
    github.event_name == 'workflow_dispatch'
      && format('manual ({0})', inputs.mode)
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'config changed'
  }}

"on":
  schedule:
    - cron: '29 14 * * 1'
  push:
    paths:
      - '.github/bos-universal-config.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: commit drift back, or check-only'
        type: choice
        options: [commit, check]
        default: commit

permissions:
  contents: read

jobs:
  sync:
    name: Sync managed files (${{ inputs.mode || 'commit' }})
    if: >-
      !cancelled()
      && (
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      )
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync configured services
        id: sync
        uses: blackoutsecure/bos-managed-file-sync-action@v1.0.4
        with:
          config_path: .github/bos-universal-config.json
          global_config_json: >-
            {"managed_file_sync":{"services":["dotfiles","shellcheck","bos_universal_action_test_kicker","bos_universal_launchpad_kicker","bos_universal_marketplace_kicker","bos_universal_security_kicker","bos_universal_sync_kicker"],"exclude_services":["dependabot_actions"],"variables":{"org_name":"Blackout Secure","support_email":"engineering@blackoutsecure.com","license":"Apache-2.0"},"service_definitions":{"bos_universal_action_test_kicker":{"mode":"update","files":[{"path":".github/workflows/bos-universal-action-test-kicker.yml","content_lines":["# Blackout Secure universal action test kicker (hub-managed).","# Customize via `.github/bos-universal-config.json`, not this file.","# Schema docs: https://github.com/blackoutsecure/bos-automation-hub","name: Blackout Secure Universal Action Test","run-name: >-","  Blackout Secure / action test / \u0024{{","    github.event_name == 'pull_request'","      && format('PR #{0}', github.event.pull_request.number)","      || github.event_name == 'push'","      && 'push'","      || 'manual'","  }}","","\"on\":","  pull_request:","    branches: [main, dev]","  push:","    branches: [main, dev]","  workflow_dispatch:","","permissions:","  contents: read","","jobs:","  parse-config:","    name: Parse universal config","    runs-on: \u0024{{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('\"{0}\"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}","    timeout-minutes: 2","    outputs:","      target_ref: \u0024{{ steps.target-ref.outputs.ref }}","    steps:","      - name: Checkout","        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1","        with:","          persist-credentials: false","      # `uses:` refs cannot be dynamic, so resolve which hub branch this","      # run targets here and pick the matching static-ref job below.","      - name: Resolve target hub ref","        id: target-ref","        env:","          EVENT_NAME: \u0024{{ github.event_name }}","          BASE_REF: \u0024{{ github.base_ref }}","          REF_NAME: \u0024{{ github.ref_name }}","        run: |","          case \"${EVENT_NAME}\" in","            pull_request|pull_request_target) ref=\"${BASE_REF}\" ;;","            *) ref=\"${REF_NAME}\" ;;","          esac","          [ \"${ref}\" = \"dev\" ] || ref=\"main\"","          echo \"ref=${ref}\" >> \"${GITHUB_OUTPUT}\"","","  action-test-dev:","    name: action-test (dev)","    needs: parse-config","    if: needs.parse-config.outputs.target_ref == 'dev'","    permissions:","      contents: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-action-test.yml@dev","","  action-test-main:","    name: action-test (main)","    needs: parse-config","    if: needs.parse-config.outputs.target_ref == 'main'","    permissions:","      contents: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-action-test.yml@main"]}]},"bos_universal_launchpad_kicker":{"mode":"update","files":[{"path":".github/workflows/bos-universal-launchpad-kicker.yml","content_lines":["# Blackout Secure Launchpad \u2014 universal kicker (hub-managed).","# Customize via `.github/bos-universal-config.json`, not this file.","# Schema docs: https://github.com/blackoutsecure/bos-automation-hub","# Required vars (names overridable via `.github/bos-universal-config.json`):","#   DOCKERHUB_NAMESPACE, BALENA_NAMESPACE","# Required secrets:","#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, BALENA_API_TOKEN","#   UPSTREAM_TOKEN (optional \u2014 only for private upstream repos)","name: Blackout Secure Launchpad (kicker)","run-name: >-","  Blackout Secure Launchpad / universal / \u0024{{","    github.event_name == 'workflow_dispatch'","      && (inputs.force_run && 'manual force' || 'manual')","      || github.event_name == 'schedule'","      && 'scheduled'","      || 'push'","  }} / ref:\u0024{{ github.ref_name }} / cf-env:\u0024{{ vars.CLOUDFLARE_DEPLOYMENT_ENV 