eds.parse-config.outputs.cfg).repo_metadata.show_releases != false }}","      repo_metadata_show_deployments: \u0024{{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_deployments == true }}","      repo_metadata_show_packages:   \u0024{{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_packages == true }}","      repo_metadata_dry_run:         \u0024{{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.dry_run == true }}","    secrets:","      DOCKERHUB_USERNAME: \u0024{{ secrets.DOCKERHUB_USERNAME }}","      DOCKERHUB_TOKEN:    \u0024{{ secrets.DOCKERHUB_TOKEN }}","      BALENA_API_TOKEN:   \u0024{{ secrets.BALENA_API_TOKEN }}","      UPSTREAM_TOKEN:     \u0024{{ secrets.UPSTREAM_TOKEN }}","      CLOUDFLARE_API_TOKEN:  \u0024{{ secrets.CLOUDFLARE_API_TOKEN }}","      CLOUDFLARE_PAGES_ADMIN_TOKEN: \u0024{{ secrets.CLOUDFLARE_PAGES_ADMIN_TOKEN }}","      CLOUDFLARE_ACCOUNT_ID: \u0024{{ secrets.CLOUDFLARE_ACCOUNT_ID }}","      CLOUDFLARE_ZONE_ID:    \u0024{{ secrets.CLOUDFLARE_ZONE_ID }}","      scanning_pat:       \u0024{{ secrets.SCANNING_PAT }}","      REPO_ADMIN_PAT:     \u0024{{ secrets.REPO_ADMIN_PAT || secrets.RELEASE_PAT }}"]}]},"bos_universal_marketplace_kicker":{"mode":"update","files":[{"path":".github/workflows/bos-universal-marketplace-kicker.yml","content_lines":["# Blackout Secure universal Marketplace kicker (hub-managed).","# Customize via `.github/bos-universal-config.json`, not this file.","# Schema docs: https://github.com/blackoutsecure/bos-automation-hub","name: Blackout Secure Universal Marketplace","run-name: >-","  Blackout Secure / marketplace / \u0024{{","    github.event_name == 'pull_request_target'","      && format('guard PR #{0}', github.event.pull_request.number)","      || github.event_name == 'pull_request'","      && format('validate PR #{0}', github.event.pull_request.number)","      || github.event_name == 'push'","      && 'validate push'","      || inputs.operation || 'manual'","  }}","","\"on\":","  pull_request:","    branches: [main, dev]","  push:","    branches: [main, dev]","  pull_request_target:","    branches: [main]","    types: [opened, synchronize, reopened]","  workflow_dispatch:","    inputs:","      operation:","        description: Marketplace operation.","        required: true","        type: choice","        options: [validate, name-check, release, metadata]","        default: validate","      tag_name:","        description: Optional SemVer release tag; empty auto-bumps the latest stable tag.","        required: false","        type: string","        default: ''","      dry_run:","        description: Preview the selected release or metadata operation without publishing or writing.","        required: false","        type: boolean","        default: false","      draft:","        description: Publish the GitHub Release as a draft.","        required: false","        type: boolean","        default: false","","permissions:","  contents: read","","concurrency:","  group: marketplace-\u0024{{ github.workflow }}-\u0024{{ github.event.pull_request.number || github.ref }}-\u0024{{ inputs.operation || 'validate' }}","  cancel-in-progress: \u0024{{ github.event_name != 'workflow_dispatch' || inputs.operation != 'release' }}","","jobs:","  parse-config:","    name: Parse universal config","    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,","    # supporting both bare label and JSON-array formats. Fallback to","    # `ubuntu-latest` if the variable is not defined in the consumer.","    runs-on: \u0024{{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('\"{0}\"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}","    timeout-minutes: 2","    outputs:","      cfg: \u0024{{ steps.config.outputs.cfg }}","      target_ref: \u0024{{ steps.target-ref.outputs.ref }}","    steps:","      - name: Checkout trusted configuration","        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1","        with:","          ref: \u0024{{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}","          persist-credentials: false","      - name: Load universal config","        id: config","        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/universal-config@main","        with:","          allow_missing: 'false'","          require_marketplace_enabled: 'true'","      # `uses:` refs cannot be dynamic, so resolve which hub branch this","      # run targets here and pick the matching static-ref job below.","      - name: Resolve target hub ref","        id: target-ref","        env:","          EVENT_NAME: \u0024{{ github.event_name }}","          BASE_REF: \u0024{{ github.base_ref }}","          REF_NAME: \u0024{{ github.ref_name }}","        run: |","          case \"${EVENT_NAME}\" in","            pull_request|pull_request_target) ref=\"${BASE_REF}\" ;;","            *) ref=\"${REF_NAME}\" ;;","          esac","          [ \"${ref}\" = \"dev\" ] || ref=\"main\"","          echo \"ref=${ref}\" >> \"${GITHUB_OUTPUT}\"","","  validate-dev:","    name: Marketplace validation (dev)","    needs: parse-config","    if: >-","      needs.parse-config.outputs.target_ref == 'dev'","      && (","        github.event_name == 'pull_request'","        || github.event_name == 'push'","        || (github.event_name == 'workflow_dispatch' && inputs.operation != 'release')","      )","    permissions:","      contents: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-marketplace.yml@dev","    with:","      action_yml_path: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.action_yml_path || 'action.yml' }}","      fail_on_warning: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.fail_on_warning == true }}","      require_security: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.require_security || 'warn' }}","      require_code_of_conduct: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.require_code_of_conduct || 'warn' }}","      require_contributing: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.require_contributing || 'warn' }}","      run_branding_preview: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.run_branding_preview != false }}","      run_name_check: \u0024{{ github.event_name == 'workflow_dispatch' && inputs.operation == 'name-check' }}","","  validate-main:","    name: Marketplace validation (main)","    needs: parse-config","    if: >-","      needs.parse-config.outputs.target_ref == 'main'","      && (","        github.event_name == 'pull_request'","        || github.event_name == 'push'","        || (github.event_name == 'workflow_dispatch' && inputs.operation != 'release')","      )","    permissions:","      contents: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-marketplace.yml@main","    with:","      action_yml_path: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.action_yml_path || 'action.yml' }}","      fail_on_warning: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.fail_on_warning == true }}","      require_security: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.require_security || 'warn' }}","      require_code_of_conduct: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.require_code_of_conduct || 'warn' }}","      require_contributing: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.require_contributing || 'warn' }}","      run_branding_preview: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.run_branding_preview != false }}","      run_name_check: \u0024{{ github.event_name == 'workflow_dispatch' && inputs.operation == 'name-check' }}","","  guard:","    name: Marketplace stable-branch guard","    needs: parse-config","    if: >-","      github.event_name == 'pull_request_target'","      && github.event.pull_request.base.ref","        == (fromJson(needs.parse-config.outputs.cfg).marketplace.target_branch || 'main')","    permissions:","      contents: read","      pull-requests: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/marketplace-repo-guard.yml@main","    with:","      pr_base_sha: \u0024{{ github.event.pull_request.base.sha }}","      pr_head_sha: \u0024{{ github.event.pull_request.head.sha }}","      check_pr_diff: true","      check_tree_state: true","      require_action_yml: true","      blocked_paths: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.blocked_paths || '.github/workflows/' }}","      required_paths: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.required_paths || '' }}","","  release:","    name: Marketplace release","    needs: parse-config","    if: \u0024{{ github.event_name == 'workflow_dispatch' && inputs.operation == 'release' }}","    permissions:","      contents: write","    uses: blackoutsecure/bos-automation-hub/.github/workflows/release-promote.yml@main","    with:","      source_branch: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.source_branch || github.event.repository.default_branch }}","      target_branch: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.target_branch || 'main' }}","      allowlist_paths: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.allowlist_paths }}","      include_dependabot_config: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.include_dependabot_config != false }}","      include_github_metadata: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.include_github_metadata == true }}","      extra_sync_paths: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.extra_sync_paths || '' }}","      tag_name: \u0024{{ inputs.tag_name }}","      dry_run: \u0024{{ inputs.dry_run }}","      release_draft: \u0024{{ inputs.draft }}","      release_make_latest: 'true'","      release_generate_notes: true","","  metadata:","    name: Marketplace repository metadata","    needs: [parse-config, release]","    if: >-","      always()","      && needs.parse-config.result == 'success'","      && fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.enable == true","      && (","        (github.event_name == 'workflow_dispatch' && inputs.operation == 'metadata')","        || (","          github.event_name == 'workflow_dispatch'","          && inputs.operation == 'release'","          && needs.release.result == 'success'","          && !inputs.dry_run","          && !inputs.draft","        )","      )","    permissions:","      contents: read","      models: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/repo-metadata-sync.yml@main","    with:","      checkout_ref: \u0024{{ inputs.operation == 'release' && needs.release.outputs.tag_name || (fromJson(needs.parse-config.outputs.cfg).marketplace.target_branch || 'main') }}","      description: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.description || '' }}","      homepage: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.homepage || '' }}","      topics: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.topics || '' }}","      generate_topics: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.generate_topics == true }}","      topics_fallback: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.topics_fallback || '' }}","      ai_enabled: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.ai_enabled != false }}","      ai_model: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.ai_model || 'openai/gpt-4o-mini' }}","      show_releases: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.show_releases != false }}","      show_deployments: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.show_deployments == true }}","      show_packages: \u0024{{ fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.show_packages == true }}","      dry_run: \u0024{{ inputs.dry_run || fromJson(needs.parse-config.outputs.cfg).marketplace.repo_metadata.dry_run == true }}","    secrets:","      REPO_ADMIN_PAT: \u0024{{ secrets.REPO_ADMIN_PAT }}","      RELEASE_PAT: \u0024{{ secrets.RELEASE_PAT }}"]}]},"bos_universal_security_kicker":{"mode":"update","files":[{"path":".github/workflows/bos-universal-security-kicker.yml","content_lines":["# Blackout Secure universal security and policy kicker (hub-managed).","# Customize via `.github/bos-universal-config.json`, not this file.","# Schema docs: https://github.com/blackoutsecure/bos-automation-hub","name: Blackout Secure Universal Security","run-name: >-","  Blackout Secure / security / \u0024{{","    github.event_name == 'pull_request'","      && format('PR #{0}', github.event.pull_request.number)","      || github.event_name == 'merge_group'","      && 'merge queue'","      || 'manual'","  }}","","\"on\":","  pull_request:","    branches: [main, dev]","  merge_group:","  workflow_dispatch:","","permissions:","  contents: read","","jobs:","  parse-config:","    name: Parse universal config","    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,","    # supporting both bare label and JSON-array formats. Fallback to","    # `ubuntu-latest` if the variable is not defined in the consumer.","    runs-on: \u0024{{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('\"{0}\"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}","    timeout-minutes: 2","    outputs:","      target_ref: \u0024{{ steps.target-ref.outputs.ref }}","    steps:","      - name: Checkout","        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1","        with:","          persist-credentials: false","      # `uses:` refs cannot be dynamic, so resolve which hub branch this","      # run targets here and pick the matching static-ref job below.","      - name: Resolve target hub ref","        id: target-ref","        env:","          EVENT_NAME: \u0024{{ github.event_name }}","          BASE_REF: \u0024{{ github.base_ref }}","          MERGE_GROUP_BASE_REF: \u0024{{ github.event.merge_group.base_ref }}","          REF_NAME: \u0024{{ github.ref_name }}","        run: |","          case \"${EVENT_NAME}\" in","            pull_request|pull_request_target) ref=\"${BASE_REF}\" ;;","            merge_group) ref=\"${MERGE_GROUP_BASE_REF#refs/heads/}\" ;;","            *) ref=\"${REF_NAME}\" ;;","          esac","          [ \"${ref}\" = \"dev\" ] || ref=\"main\"","          echo \"ref=${ref}\" >> \"${GITHUB_OUTPUT}\"","","  security-dev:","    name: security (dev)","    needs: parse-config","    if: needs.parse-config.outputs.target_ref == 'dev'","    permissions:","      contents: read","      security-events: write","      actions: read","      pull-requests: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-security.yml@dev","    with:","      config_authoritative: true","    secrets:","      scanning_pat: \u0024{{ secrets.SCANNING_PAT }}","","  security-main:","    name: security (main)","    needs: parse-config","    if: needs.parse-config.outputs.target_ref == 'main'","    permissions:","      contents: read","      security-events: write","      actions: read","      pull-requests: read","    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-security.yml@main","    with:","      config_authoritative: true","    secrets:","      scanning_pat: \u0024{{ secrets.SCANNING_PAT }}"]}]},"bos_universal_sync_kicker":{"mode":"update","files":[{"path":".github/workflows/bos-universal-sync-kicker.yml","content_lines":["# Blackout Secure universal sync kicker (hub-managed).","# Customize sync defaults in the `global_config_json` input below.","# Schema docs: https://github.com/blackoutsecure/bos-automation-hub","name: Blackout Secure universal sync (kicker)","run-name: >-","  Blackout Secure universal sync / \u0024{{","    github.event_name == 'workflow_dispatch'","      && format('manual ({0})', inputs.mode)","      || github.event_name == 'schedule'","      && 'scheduled'","      || 'config changed'","  }}","","\"on\":","  schedule:","    - cron: '29 14 * * 1'","  push:","    paths:","      - '.github/bos-universal-config.json'","  workflow_dispatch:","    inputs:","      mode:","        description: 'Run mode: commit drift back, or check-only'","        type: choice","        options: [commit, check]","        default: commit","","permissions:","  contents: read","","jobs:","  sync:","    name: Sync managed files (\u0024{{ inputs.mode || 'commit' }})","    if: >-","      !cancelled()","      && (","        github.event_name != 'push'","        || github.ref_name == github.event.repository.default_branch","      )","    runs-on: \u0024{{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('\"{0}\"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}","    timeout-minutes: 5","    permissions:","      contents: write","    steps:","      - name: Checkout","        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1","        with:","          fetch-depth: 0","          persist-credentials: true","","      - name: Sync configured services","        id: sync","        uses: blackoutsecure/bos-managed-file-sync-action@v1.0.4","        with:","          config_path: .github/bos-universal-config.json","          global_config_json: >-","            {","              \"managed_file_sync\": {","                \"services\": [","                  \"dotfiles\",","                  \"shellcheck\"","                ],","                \"exclude_services\": [","                  \"dependabot_actions\"","                ],","                \"variables\": {","                  \"org_name\": \"Blackout Secure\",","                  \"support_email\": \"engineering@blackoutsecure.com\",","                  \"license\": \"Apache-2.0\"","                }","              }","            }","          dry_run: \u0024{{ (inputs.mode || 'commit') == 'check' }}","          fail_on_drift: \u0024{{ (inputs.mode || 'commit') == 'check' }}","          show_diff: 'true'","","      - name: Commit and push","        if: >-","          (inputs.mode || 'commit') == 'commit'","          && steps.sync.outputs.changed == 'true'","        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/commit-and-push@main","        with:","          files: \u0024{{ steps.sync.outputs.changed_files }}","          message: 'chore: sync managed files'"]}]}}}}
          dry_run: ${{ (inputs.mode || 'commit') == 'check' }}
          fail_on_drift: ${{ (inputs.mode || 'commit') == 'check' }}
          show_diff: 'true'

      - name: Commit and push
        if: >-
          (inputs.mode || 'commit') == 'commit'
          && steps.sync.outputs.changed == 'true'
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/commit-and-push@main
        with:
          files: ${{ steps.sync.outputs.changed_files }}
          message: 'chore: sync managed files'
