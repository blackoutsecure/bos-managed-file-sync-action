arse-config.outputs.cfg).cloudflare.common_sitemap_xml_cache_control || 'public, max-age=86400' }}","      cloudflare_common_humans_txt_cache_control: \u0024{{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_humans_txt_cache_control || 'public, max-age=86400' }}","      cloudflare_headers_custom_rules: |-","        \u0024{{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_custom_rules || '' }}","      cloudflare_headers_replace_existing:  \u0024{{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_replace_existing == true }}","","      # ----- GitHub Release stage -----","      release_template_path:  \u0024{{ fromJson(needs.parse-config.outputs.cfg).release.template_path || '' }}","      release_extra_context:  \u0024{{ fromJson(needs.parse-config.outputs.cfg).release.extra_context || '' }}","      generate_release_notes: \u0024{{ fromJson(needs.parse-config.outputs.cfg).release.generate_notes != false }}","      release_files:          \u0024{{ fromJson(needs.parse-config.outputs.cfg).release.files || '' }}","      release_draft:          \u0024{{ fromJson(needs.parse-config.outputs.cfg).release.draft == true }}","","      # ----- Shared -----","      platforms: \u0024{{ fromJson(needs.parse-config.outputs.cfg).platforms || 'linux/amd64,linux/arm64' }}","","      # ----- Universal kicker wiring -----","      use_launchpad_config: true","","      # ----- Optional stages configured from data file -----","      enable_security_scan:         \u0024{{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable != false }}","      security_scan_fail_on:        \u0024{{ fromJson(needs.parse-config.outputs.cfg).security_scan.fail_on || 'fail' }}","      security_scan_blocks_release: \u0024{{ fromJson(needs.parse-config.outputs.cfg).security_scan.blocks_release != false }}","      security_scan_enable_kit_composite: \u0024{{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_kit_composite != false }}","      security_scan_enable_