# Managed by Blackout Secure. Best practices applied via marketplace config, customized in .github/blackout-secure-managed-file-sync-global-config.json and .github/bos-universal-config.json.
# Do not edit — every sync run overwrites this file when it exists.
# Blackout Secure universal sync kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: Blackout Secure universal sync (kicker)
run-name: >-
  Blackout Secure universal sync / ${{
    github.event_name == 'workflow_dispatch'
      && format('manual ({0})', inputs.mode)
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'config changed'
  }}

"on":
  schedule:
    - cron: '29 14 * * 1'
  push:
    paths:
      - '.github/bos-universal-config.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: commit drift back, or check-only'
        type: choice
        options: [commit, check]
        default: commit

permissions:
  contents: read

jobs:
  parse_config:
    name: Resolve target hub ref
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      target_ref: ${{ steps.target_ref.outputs.ref }}
    steps:
      # `uses:` refs cannot be dynamic, so resolve which hub branch this
      # run targets here and pick the matching static-ref job below.
      - name: Resolve target hub ref
        id: target_ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="main"
          [ "${REF_NAME}" = "dev" ] && ref="dev"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

  sync-dev:
    name: Sync managed files (dev)
    needs: parse_config
    if: >-
      !cancelled()
      && needs.parse_config.outputs.target_ref == 'dev'
      && (
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      )
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@dev
    with:
      mode: ${{ inputs.mode || '' }}
    secrets: inherit

  sync-main:
    name: Sync managed files (main)
    needs: parse_config
    if: >-
      !cancelled()
      && needs.parse_config.outputs.target_ref == 'main'
      && (
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      )
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@main
    with:
      mode: ${{ inputs.mode || '' }}
    secrets: inherit
