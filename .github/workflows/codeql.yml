# Thin caller for the consolidated security-scan reusable in bos-automation-hub,
# so a single hub commit propagates pin / version bumps to every repo.
#
# Transitive invocations performed by the hub-side reusable, kept inline so
# audit tooling can see them at this repo's surface. Bump in lockstep with
# `bos-automation-hub/.github/workflows/security-scan.yml`:
#
#   uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa    # v4.36.0
#   uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

name: CodeQL

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/security-scan.yml@main
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      # Passed to `fromJSON()` on the reusable side, so it must be valid JSON —
      # YAML's `[python, actions]` shorthand is rejected there.
      codeql_languages: '["python", "actions"]'
      codeql_queries:   security-and-quality
