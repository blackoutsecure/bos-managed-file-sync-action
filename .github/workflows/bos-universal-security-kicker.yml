# Blackout Secure universal security and policy kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: Blackout Secure Universal Security
run-name: >-
  Blackout Secure / security / ${{
    github.event_name == 'pull_request'
      && format('PR #{0}', github.event.pull_request.number)
      || github.event_name == 'merge_group'
      && 'merge queue'
      || 'manual'
  }}

"on":
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-config:
    name: Parse universal config
    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,
    # supporting both bare label and JSON-array formats. Fallback to
    # `ubuntu-latest` if the variable is not defined in the consumer.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      target_ref: ${{ steps.target-ref.outputs.ref }}
    steps:
      # `uses:` refs cannot be dynamic, so resolve which hub branch this
      # run targets here and pick the matching static-ref job below.
      - name: Resolve target hub ref
        id: target-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "${EVENT_NAME}" in
            pull_request|pull_request_target) ref="${BASE_REF}" ;;
            merge_group) ref="${MERGE_GROUP_BASE_REF#refs/heads/}" ;;
            *) ref="${REF_NAME}" ;;
          esac
          [ "${ref}" = "dev" ] || ref="main"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

  security-dev:
    name: security (dev)
    needs: parse-config
    if: needs.parse-config.outputs.target_ref == 'dev'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-security.yml@dev
    with:
      config_authoritative: true
    secrets: inherit

  security-main:
    name: security (main)
    needs: parse-config
    if: needs.parse-config.outputs.target_ref == 'main'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-security.yml@main
    with:
      config_authoritative: true
    secrets: inherit
